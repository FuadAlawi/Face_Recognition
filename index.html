<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Face-Recognition Demo</title>

  <link rel="stylesheet" href="styles.css" />
  <style>
    #tsparticles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
    }
  </style>
</head>
<body>
  <div class="cursor"></div>
  <video id="bg-video" autoplay loop muted playsinline poster="background.png"></video>
  <div class="card shadow">
    <h1 class="title">🚀 Face Recognition Made Easy  </h1>
    <p class="subtitle">👁️‍🗨️ Detect Faces Like Magic 👁️‍🗨️</p>

    <button class="btn-start" onclick="location.href='app.html'">
      Start
    </button>
  </div>
  <script>
    const bgVideo = document.getElementById('bg-video');
    const sourceMP4 = document.createElement('source');
    sourceMP4.src = 'background.mp4';
    sourceMP4.type = 'video/mp4';
    bgVideo.appendChild(sourceMP4);
  </script>
  <script>
    const cursor = document.querySelector('.cursor');
    const colors = [
      "#00eaff", "#00ffd0", "#00ffb3", "#00ff8c", "#00ff5c", "#00ff2a", "#00ff00"
    ];
    document.addEventListener("mousemove", (e) => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
      createSparkle(e.clientX, e.clientY);
    });
    function createSparkle(x, y) {
      const sparkle = document.createElement("div");
      sparkle.classList.add("cursor-trail");
      const color = colors[Math.floor(Math.random() * colors.length)];
      const size = Math.random() * 10 + 5;
      const angle = Math.random() * Math.PI * 2;
      const distance = Math.random() * 30 + 10;
      sparkle.style.background = color;
      sparkle.style.boxShadow = `0 0 10px ${color}`;
      sparkle.style.width = `${size}px`;
      sparkle.style.height = `${size}px`;
      sparkle.style.left = `${x}px`;
      sparkle.style.top = `${y}px`;
      sparkle.style.position = 'fixed';
      sparkle.style.borderRadius = '50%';
      sparkle.style.pointerEvents = 'none';
      sparkle.style.transform = 'translate(-50%, -50%)';
      sparkle.style.zIndex = 9998;
      document.body.appendChild(sparkle);
      sparkle.animate([
        {
          opacity: 1,
          transform: "translate(-50%,-50%) scale(1)"
        },
        {
          opacity: 0,
          transform: `translate(calc(-50% + ${Math.cos(angle) * distance}px), calc(-50% + ${Math.sin(angle) * distance}px)) scale(0)`
        }
      ], {
        duration: 800,
        easing: "cubic-bezier(0.4, 0, 0.2, 1)",
        fill: "forwards"
      });
      setTimeout(() => {
        sparkle.remove();
      }, 800);
    }
    document.addEventListener("touchmove", (e) => {
      const touch = e.touches[0];
      cursor.style.left = touch.clientX + "px";
      cursor.style.top = touch.clientY + "px";
      createSparkle(touch.clientX, touch.clientY);
    }, { passive: false });
  </script>
</body>
</html>
